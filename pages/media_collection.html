    <script>
        class MediaItem {
            static idGen = 0;
            #mediaId;
            #legoSetInfo;

            constructor(name, number, pieces, retailPrice, currentValue, image) {
                this.name = name;
                this.number = number;
                this.pieces = pieces;
                this.retailPrice = retailPrice;
                this.currentValue = currentValue;
                this.image = image;

                // Generating unique id for each media item
                this.#mediaId = MediaItem.idGen++;

                // Helper method to create HTML element for media item
                this.#makeMediaElement();
            }

            #makeMediaElement() {
                this.#legoSetInfo = document.createElement('div');
                this.#legoSetInfo.classList.add('media-item');
                this.#legoSetInfo.setAttribute('id', this.#mediaId);

                const imgElement = document.createElement('img');
                imgElement.src = this.image; // image source
                imgElement.alt = this.name;

                const nameElement = document.createElement('h2');
                nameElement.textContent = this.name;

                const numberElement = document.createElement('p');
                numberElement.textContent = `Set Number: ${this.number}`;

                const piecesElement = document.createElement('p');
                piecesElement.textContent = `Pieces: ${this.pieces}`;

                const retailPriceElement = document.createElement('p');
                retailPriceElement.textContent = `Retail Price: $${this.retailPrice}`;

                const currentValueElement = document.createElement('p');
                currentValueElement.textContent = `Current Value: $${this.currentValue}`;

                this.#legoSetInfo.appendChild(imgElement);
                this.#legoSetInfo.appendChild(nameElement);
                this.#legoSetInfo.appendChild(numberElement);
                this.#legoSetInfo.appendChild(piecesElement);
                this.#legoSetInfo.appendChild(retailPriceElement);
                this.#legoSetInfo.appendChild(currentValueElement);
            }

            get mediaElement() {
                return this.#legoSetInfo;
            }
        }

        const mediaData = [
        {
        name: "Straight Rails",
        number: "4515",
        pieces: 8,

        {

        image: "../images/4546.jpg"

        {

        number: "4548",

        {

        image: "../images/4563.jpg"
        }
      ];

        const mediaContainer = document.getElementById('media-container');

        mediaData.forEach(item => {
            const mediaItem = new MediaItem(item.name, item.number, item.pieces, item.retailPrice, item.currentValue, item.image);
            mediaContainer.appendChild(mediaItem.mediaElement);
        });
      </script>
