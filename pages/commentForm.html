		<h2>Comment Submission Form</h2>
	
    <form id="signupForm" action="process.php" method="post">
      <label for="email">Email:</label>
      <input id="email" name="useremail" type="email" placeholder="myname@email.com" autocomplete="email" required>

        <br>

      <label for="year">Year of Birth:</label>
      <input id="year" name="dob" placeholder="####" pattern="[0-9]{4}" title="Please enter 4 numbers." required>

        <br>

      <label for="username">Username:</label>
      <input id="username" name="user" type="text" autocomplete="username" pattern="[a-zA-Z0-9_]{4,14}" title="4-14 characters, letters, numbers, and underscores" required>
      
        <br>

      <label for="password">Password:</label>
      <input id="password" name="userpass" type="password" required> 

        <br>

      <p id="passwordMessage" class="password-message"></p>

        <br>
        
      <button type="submit">Sign Up</button>
    </form>
