		<h2>Comment Submission Form</h2>
	
    <form id="signupForm" action="process.php" method="post" onsubmit="return validateForm()">
      <label for="name">Name:</label>
      <input id="name" name="name" type="text" placeholder="Name" required pattern="[A-Za-z\s]{2,}" title="Enter your name.">
      
      <br>

      <label for="phone">Phone Number:</label>
      <input id="phone" name="phone" type="tel" placeholder="111-222-3333" required pattern="\d{3}[\-]\d{3}[\-]\d{4}" title="111-222-3333">
      
      <br>

      <label for="email">Email:</label>
      <input id="email" name="useremail" type="email" placeholder="username@email.com" autocomplete="email" required>
      
      <br>

      <label for="comment">Comment:</label>
      <textarea id="comment" name="comment" rows="4" cols="50" placeholder="Comment your comments: " required></textarea>
      
      <br>

      <label for="username">Username:</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      
      <br>

      <label for="password">Password:</label>
      <input id="password" name="userpass" type="password" required>
      
      <br>

      <p id="passwordMessage" class="password-message"></p>

      <br>
      
      <button type="submit">Submit</button>
  </form>
